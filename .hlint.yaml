# circuits hlint policy — approved 2026-08-17
#
# Suppressed (house style — explicit point-wise code and law witnesses,
# not point-free rewrites):
- ignore: {name: "Avoid lambda"}
- ignore: {name: "Avoid lambda using `infix`"}
- ignore: {name: "Eta reduce"}
- ignore: {name: "Use tuple-section"}
- ignore: {name: "Use null"}
- ignore: {name: "Use const"}
- ignore: {name: "Use bimap"}
- ignore: {name: "Use replicateM"}
- ignore: {name: "Use replicateM_"}
- ignore: {name: "Use curry"}
- ignore: {name: "Use second"}
#
# Kept active (fixed in source, never ignored):
#   Use camelCase          — sloppy names get renamed
#   Unused LANGUAGE pragma — dead pragmas removed
#   Use newtype instead of data — applied where appropriate
